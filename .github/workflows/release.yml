name: Release

# On every push to main, changesets either opens/updates a "Version packages" PR (when there are
# changesets) or, once that PR is merged, publishes the new versions to npm with trusted publishing
# (OIDC, no token) and provenance. Each package must list this workflow as a trusted publisher on
# npmjs.com (Settings → Trusted publishing → GitHub Actions: openbooking-sh/openbooking, release.yml).

on:
  push:
    branches: [main]

concurrency: release

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@^11.5.1
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          title: 'Release: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
