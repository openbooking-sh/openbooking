name: Release

# On every push to main, changesets either opens/updates a "Version packages" PR (when there are
# changesets) or, once that PR is merged, stages the new versions on npm with trusted publishing
# (OIDC, no token) and provenance. A maintainer then approves each staged version on npmjs.com
# (Staged Packages, with 2FA) before it goes live. Each package must list this workflow as a trusted publisher on
# npmjs.com (Settings → Trusted publishing → GitHub Actions: openbooking-sh/openbooking, release.yml).

on:
  push:
    branches: [main]

concurrency: release

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Staged publishing with trusted publishing needs npm 11.15 or newer.
      - run: npm install -g npm@^11.15.0
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm version-packages
          publish: pnpm release
          title: 'Release: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
