# Weekly dependency updates, sized for one maintainer: minor and patch bumps arrive as one grouped
# PR per ecosystem, majors as their own PRs so breaking changes are reviewed one at a time.
#
# The npm entry points at the workspace root: Dependabot reads pnpm-workspace.yaml and
# pnpm-lock.yaml there and updates every workspace package from it. The scaffold template
# (packages/create-openbooking/template) is left out on purpose: its package.json holds
# placeholders such as "^{{VERSION_SERVER}}" that are not valid versions, and it has no lockfile.
#
# A PR that changes the runtime dependencies of a published package still needs a changeset
# (.changeset/*.md) before merging, or the change ships without a release.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
